name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_pms
          POSTGRES_USER: hotel_pms
          POSTGRES_PASSWORD: hotel_pms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_pms -d hotel_pms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/hotel_pms
          TEST_DB_USER: hotel_pms
          TEST_DB_PASSWORD: hotel_pms_dev
        run: bash ./mvnw -B -ntp verify
      - name: Start API and verify Flyway migration
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/hotel_pms
          DB_USER: hotel_pms
          DB_PASSWORD: hotel_pms_dev
          JWT_SECRET: ci-only-signing-key-not-for-deployment-at-least-32-characters
          APP_PRICING_USE_STUB_PORTS: "true"
        run: |
          java -jar target/*.jar > startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat startup.log
              exit 1
            fi
            sleep 2
          done
          cat startup.log
          exit 1
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
