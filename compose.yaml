services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_pms}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_pms_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_pms} -d ${POSTGRES_DB:-hotel_pms}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_EMBEDDED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hotel_pms}
      DB_USER: ${POSTGRES_USER:-hotel_pms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_pms_dev}
      JWT_SECRET: ${JWT_SECRET:-hotel-pms-compose-demo-only-signing-key-change-before-deployment}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-HotelPmsDemo123!}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
