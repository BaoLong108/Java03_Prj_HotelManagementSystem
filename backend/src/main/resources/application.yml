spring:
  application:
    name: hotel-pms-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_pms}
    username: ${DB_USER:hotel_pms}
    password: ${DB_PASSWORD:hotel_pms_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  check-in:
    days-before-arrival: ${CHECK_IN_DAYS_BEFORE_ARRIVAL:3}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: hotel-pms-api
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
