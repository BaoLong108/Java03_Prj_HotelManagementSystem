spring:
  application:
    name: hotel-pms-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_pms}
    username: ${DB_USER:hotel_pms}
    password: ${DB_PASSWORD:hotel_pms_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
