spring:
  application:
    name: hotel-pms-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_pms}
    username: ${DB_USER:hotel_pms}
    password: ${DB_PASSWORD:hotel_pms_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  support:
    ai:
      enabled: ${AI_ENABLED:false}
      provider: ${AI_PROVIDER:openai-compatible}
      api-key: ${AI_API_KEY:}
      model: ${AI_MODEL:}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      request-timeout: ${AI_REQUEST_TIMEOUT:12s}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:400}
      max-conversation-context: ${AI_MAX_CONVERSATION_CONTEXT:6}
  room-images:
    max-bytes: ${ROOM_IMAGE_MAX_BYTES:5242880}
  payment:
    demo-enabled: false
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment-return}
    ipn-url: ${VNPAY_IPN_URL:}
  check-in:
    days-before-arrival: ${CHECK_IN_DAYS_BEFORE_ARRIVAL:3}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: hotel-pms-api
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
